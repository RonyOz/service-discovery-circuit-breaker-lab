spring.application.name=fx-catalog-service
server.port=8002
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Circuit Breaker: abre el circuito si >=50% de las ultimas 10 llamadas fallan (minimo 5 llamadas)
resilience4j.circuitbreaker.instances.courseService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.courseService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.courseService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.courseService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.courseService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.courseService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.courseService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.courseService.eventConsumerBufferSize=10
# Rechazos de RateLimiter/Bulkhead son throttling propio, no fallas de course: no cuentan para abrir el circuito
resilience4j.circuitbreaker.instances.courseService.ignoreExceptions=io.github.resilience4j.ratelimiter.RequestNotPermitted,io.github.resilience4j.bulkhead.BulkheadFullException

# Retry: hasta 3 intentos separados 500ms; no reintenta si una capa interna rechazo la llamada sin intentarla
resilience4j.retry.instances.courseService.maxAttempts=3
resilience4j.retry.instances.courseService.waitDuration=500ms
resilience4j.retry.instances.courseService.ignoreExceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException,io.github.resilience4j.ratelimiter.RequestNotPermitted,io.github.resilience4j.bulkhead.BulkheadFullException

# RateLimiter: maximo 5 llamadas a course por segundo; sin permiso rechaza al instante (no encola)
resilience4j.ratelimiter.instances.courseService.limitForPeriod=5
resilience4j.ratelimiter.instances.courseService.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.courseService.timeoutDuration=0
resilience4j.ratelimiter.instances.courseService.subscribeForEvents=true

# TimeLimiter: deja de esperar a course a los 2s (cuenta como fallo para el circuito)
resilience4j.timelimiter.instances.courseService.timeoutDuration=2s

# Bulkhead (thread pool): maximo 2 llamadas simultaneas a course + 1 en cola; el resto se rechaza.
# Valores chicos a proposito para poder demostrarlo en local.
resilience4j.thread-pool-bulkhead.instances.courseService.coreThreadPoolSize=2
resilience4j.thread-pool-bulkhead.instances.courseService.maxThreadPoolSize=2
resilience4j.thread-pool-bulkhead.instances.courseService.queueCapacity=1

# Monitoreo con Actuator
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents,retries,retryevents,ratelimiters,ratelimiterevents,timelimiters,timelimiterevents,bulkheads,bulkheadevents
management.endpoint.health.show-details=always
